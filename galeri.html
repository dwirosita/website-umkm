<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Kopi Nusa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <h1>Kopi Nusa</h1>
        <p>UMKM Kopi Lokal Pekalongan</p>

        <nav aria-label="Navigasi utama">
            <a href="index.html">Beranda</a>
            <a href="tentang.html">Tentang Kami</a>
            <a href="produk.html">Produk</a>
            <a href="galeri.html">Galeri</a>
        </nav>
    </div>
</header>

<main>
    <section class="produk-section">
        <div class="container">
            <h2>Galeri Produk</h2>

            <div class="produk">

                <figure class="card">
                    <img src="assets/images/kopi tubruk signature.jpeg"
                         alt="Kopi Tubruk Signature">
                    <figcaption>
                        Kopi Tubruk Signature - Rp18.000
                    </figcaption>
                </figure>

                <figure class="card">
                    <img src="assets/images/cold brew aren.jpeg"
                         alt="Cold Brew Aren">
                    <figcaption>
                        Cold Brew Aren - Rp22.000
                    </figcaption>
                </figure>

                <figure class="card">
                    <img src="assets/images/kopi susu gula aren.jpeg"
                         alt="Kopi Susu Gula Aren">
                    <figcaption>
                        Kopi Susu Gula Aren - Rp20.000
                    </figcaption>
                </figure>

                <figure class="card">
                    <img src="assets/images/kopi robusta.jpeg"
                         alt="Kopi Robusta Nusa">
                    <figcaption>
                        Kopi Robusta Nusa - Rp25.000
                    </figcaption>
                </figure>

            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <p>&copy; 2026 Kopi Nusa. Semua hak dilindungi.</p>
</footer>

</body>
</html>
